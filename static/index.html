<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地截图 / 发票提取</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#172033;background:#f4f7fb;line-height:1.5}*{box-sizing:border-box}body{margin:0}.page{max-width:1480px;margin:auto;padding:28px}.hero,.panel{background:#fff;border:1px solid #dce4ef;border-radius:18px;box-shadow:0 10px 30px #24405b0d}.hero{padding:24px 28px;margin-bottom:18px;display:flex;justify-content:space-between;gap:24px;align-items:center}.hero h1{margin:0;font-size:28px}.hero p{margin:7px 0 0;color:#64748b}.badge{background:#e8f7ee;color:#18794e;border-radius:99px;padding:7px 12px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.panel{padding:22px;margin-bottom:18px}h2{margin:0 0 16px;font-size:20px}label{display:block;font-weight:650;margin-bottom:6px}.hint,.muted{color:#64748b;font-size:14px}.row{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:190px}input,textarea,select,button{font:inherit}input[type=text],input[type=password],textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff}textarea{min-height:82px;resize:vertical}button{border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:#172033;color:#fff;font-weight:700}button.secondary{background:#edf2f7;color:#253349}button.danger{background:#fff0f0;color:#b42318}button:disabled{opacity:.45;cursor:not-allowed}.upload{margin-top:16px;border:2px dashed #b8c4d4;border-radius:14px;padding:18px;background:#f8fafc}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.progress-wrap{display:none;margin-top:16px}.progress-track{height:12px;background:#e5eaf1;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#2864dc,#36b37e);transition:width .2s}.progress-text{margin-top:8px}.notice{padding:11px 13px;border-radius:10px;margin-top:12px;display:none}.notice.warn{display:block;background:#fff4d6;color:#7a4d00}.notice.error{display:block;background:#feecec;color:#a31616}.notice.ok{display:block;background:#e8f7ee;color:#176b45}.history{display:grid;gap:10px;max-height:620px;overflow:auto}.history-card{border:1px solid #dce4ef;border-radius:12px;padding:12px}.history-card.active{border-color:#2864dc;background:#eff5ff}.history-card strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-card small{color:#64748b}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.table-wrap{overflow:auto;margin-top:14px;border:1px solid #dce4ef;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:900px}th,td{border-bottom:1px solid #e5eaf1;padding:9px 11px;text-align:center;vertical-align:middle;white-space:normal;word-break:break-word}th{background:#eaf2fb;position:sticky;top:0}tr:last-child td{border-bottom:0}.review{color:#b42318;font-weight:700}.manual-list{display:grid;gap:8px;margin-top:12px}.manual-item{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;border:1px solid #dce4ef;border-radius:10px;padding:9px 12px}.manual-total{font-weight:800;color:#2864dc}.hidden{display:none!important}@media(max-width:900px){.page{padding:14px}.grid{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.manual-item{grid-template-columns:90px 1fr}}
</style></head><body><main class="page">
<section class="hero"><div><h1>本地截图 / 发票提取</h1><p>支付截图、订单、图片和 PDF 混传；识别、历史与 Excel 均保存在本机。</p></div><span class="badge">离线 OCR · 单次最多 200 个文件</span></section>
<div class="grid"><div>
<section class="panel"><h2>新建提取</h2><div class="row"><div class="field"><label for="title">报销单标题 / 文件名</label><input id="title" type="text" placeholder="例如：张三费用报销单"><div class="hint">导出时自动追加识别到的日期区间。</div></div><div class="field"><label for="token">访问口令</label><input id="token" type="password" autocomplete="current-password"><div class="hint">只保存在当前浏览器。</div></div></div>
<div style="margin-top:14px"><label for="columns">要提取的列</label><textarea id="columns">付款金额、付款时间、商家名称、备注</textarea><div class="hint">用逗号、顿号或换行分隔。系统自动增加发票状态、费用用途、置信度和人工核对说明。</div></div>
<div class="upload"><div class="row"><div class="field"><label for="files">图片 / PDF</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,.pdf" multiple><div id="fileCount" class="hint">尚未选择文件</div></div><div class="field" style="max-width:180px"><label for="workers">识别线程</label><select id="workers"><option value="1">1（最低占用）</option><option value="2" selected>2（推荐）</option><option value="3">3</option><option value="4">4（较快）</option></select></div></div><label style="margin-top:12px;font-weight:500"><input id="force" type="checkbox"> 历史中已有相同文件也重新处理</label><div class="actions"><button id="start">开始提取</button></div><div id="progressWrap" class="progress-wrap"><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div id="progressText" class="progress-text"></div></div><div id="notice" class="notice"></div></div></section>
<section class="panel"><div class="result-head"><h2>手工补录</h2><button id="toggleManual" class="secondary">收起</button></div><div id="manualBody"><p class="hint">每行写一组，金额表达式自动相加。例：<code>出差餐补320</code>、<code>车票8+8.43+105+10</code>。类型统一为“无票无支付记录”。</p><textarea id="manualDraft" placeholder="出差餐补320&#10;车票8+8.43+105+10"></textarea><div class="actions"><button id="parseManual" class="secondary">解析补录</button><button id="saveManual" disabled>保存到当前批次</button></div><div id="manualList" class="manual-list"></div></div></section>
<section id="resultPanel" class="panel hidden"><div class="result-head"><div><h2 id="resultTitle">提取结果</h2><div id="resultMeta" class="muted"></div></div><div class="actions"><button id="rename" class="secondary">重命名</button><button id="export">导出 Excel</button></div></div><div id="duplicateNotice" class="notice"></div><div id="reviewNotice" class="notice"></div><div id="table" class="table-wrap"></div></section>
</div><aside class="panel"><div class="result-head"><h2>本地历史</h2><button id="refreshHistory" class="secondary">刷新</button></div><div id="history" class="history"><span class="muted">输入口令后加载。</span></div></aside></div></main>
<script>
const $=id=>document.getElementById(id);const state={jobId:"",result:null,manual:[],reviewAlerted:new Set()};
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
const authHeaders=()=>$('token').value?{'X-Receipt-Token':$('token').value}:{};
function setNotice(message,type="ok"){const node=$('notice');node.textContent=message;node.className=`notice ${type}`}
async function api(url,options={}){const response=await fetch(url,{...options,headers:{...authHeaders(),...(options.json?{'Content-Type':'application/json'}:{}),...(options.headers||{})},body:options.json?JSON.stringify(options.json):options.body});if(!response.ok){let message=`请求失败（${response.status}）`;try{message=(await response.json()).detail||message}catch{}throw new Error(message)}return response}
async function parseManualDraft(text){return await (await api('/api/manual/parse',{method:'POST',json:{manual_draft:text}})).json()}
function renderManual(){const total=state.manual.reduce((sum,item)=>sum+Number(item.金额||0),0);$('manualList').innerHTML=state.manual.map((item,index)=>`<div class="manual-item"><strong>¥${esc(item.金额)}</strong><span>${esc(item.用途)} <small class="muted">${esc(item.备注)}</small></span><button class="danger" data-remove="${index}">删除</button></div>`).join("")+(state.manual.length?`<div class="manual-total">补录合计：¥${total.toFixed(2)}</div>`:"");$('manualList').querySelectorAll('[data-remove]').forEach(button=>button.onclick=()=>{state.manual.splice(Number(button.dataset.remove),1);renderManual()});$('saveManual').disabled=!state.jobId}
function renderResult(result){state.result=result;state.jobId=result.job_id;state.manual=Array.isArray(result.manual_entries)?result.manual_entries:state.manual;$('manualDraft').value=result.manual_draft??$('manualDraft').value;renderManual();$('resultPanel').classList.remove('hidden');$('resultTitle').textContent=result.title||'提取结果';$('title').value=result.title||$('title').value;const rows=result.rows||[];$('resultMeta').textContent=`${rows.length} 条报销记录 · ${result.total??0} 个已处理文件`;const duplicates=result.duplicate_count||0;$('duplicateNotice').className=duplicates?'notice warn':'notice';$('duplicateNotice').textContent=duplicates?`发现 ${duplicates} 个重复文件，已排除且不参与合计：${(result.duplicate_files||[]).join('、')}`:'';const reviews=rows.filter(row=>row['核对状态']==='需人工核对'||row['是否人工核对']==='是');$('reviewNotice').className=reviews.length?'notice warn':'notice';$('reviewNotice').textContent=reviews.length?`有 ${reviews.length} 条无法可靠确认，请人工核对后再报销；系统没有用猜测值自动填充。`:'';if(reviews.length&&!state.reviewAlerted.has(result.job_id)){state.reviewAlerted.add(result.job_id);setTimeout(()=>alert(`有 ${reviews.length} 条记录无法可靠确认，请人工核对红色提示后再导出。`),0)}const columns=['源文件',...(result.columns||[])];$('table').innerHTML=`<table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${columns.map(c=>`<td class="${c.includes('核对')&&String(row[c]||'').includes('需')?'review':''}">${esc(row[c]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function loadHistory(){try{localStorage.setItem('receipt-token',$('token').value);const items=await (await api('/api/history')).json();$('history').innerHTML=items.length?items.map(item=>`<div class="history-card ${item.job_id===state.jobId?'active':''}"><strong>${esc(item.title||item.created_at)}</strong><small>${esc(new Date(item.created_at).toLocaleString())} · ${item.total} 个文件 · ${(item.rows||[]).length} 条</small><div class="actions"><button class="secondary" data-open="${esc(item.job_id)}">打开</button><button class="danger" data-delete="${esc(item.job_id)}">删除</button></div></div>`).join(''):'<span class="muted">暂无历史记录。</span>';items.forEach(item=>{const open=$('history').querySelector(`[data-open="${CSS.escape(item.job_id)}"]`);if(open)open.onclick=()=>renderResult(item);const del=$('history').querySelector(`[data-delete="${CSS.escape(item.job_id)}"]`);if(del)del.onclick=async()=>{if(!confirm('确认删除这个批次及其本地图片？'))return;await api(`/api/history/${item.job_id}`,{method:'DELETE'});if(state.jobId===item.job_id){state.jobId='';state.result=null;$('resultPanel').classList.add('hidden');renderManual()}await loadHistory()}})}catch(error){$('history').innerHTML=`<span class="review">${esc(error.message)}</span>`}}
$('files').onchange=()=>{if(state.jobId){state.jobId='';state.result=null;state.manual=[];$('manualDraft').value='';$('resultPanel').classList.add('hidden');renderManual()}$('fileCount').textContent=`已选择 ${$('files').files.length} 个文件`};$('token').value=localStorage.getItem('receipt-token')||'';$('token').onchange=loadHistory;
$('start').onclick=async()=>{const files=[...$('files').files];if(!files.length)return setNotice('请先选择图片或 PDF。','error');if(files.length>200)return setNotice('单次最多 200 个文件。','error');const columns=$('columns').value.split(/[，,、\n]+/).map(v=>v.trim()).filter(Boolean);if(!columns.length)return setNotice('请至少填写一个提取列。','error');$('start').disabled=true;$('progressWrap').style.display='block';$('progressBar').style.width='0%';setNotice('正在提交文件…');try{localStorage.setItem('receipt-token',$('token').value);const form=new FormData();form.append('columns',JSON.stringify(columns));form.append('worker_count',$('workers').value);form.append('force_reprocess',$('force').checked?'true':'false');form.append('title',$('title').value.trim());files.forEach(file=>form.append('files',file));const started=await (await api('/api/process',{method:'POST',body:form})).json();state.jobId=started.job_id;renderManual();for(;;){await new Promise(resolve=>setTimeout(resolve,400));const status=await (await api(`/api/status/${state.jobId}`)).json();const percent=status.total?Math.round(status.completed/status.total*100):100;$('progressBar').style.width=`${percent}%`;$('progressText').textContent=`${status.completed}/${status.total} · ${status.current_file||'正在整理结果'}`;if(status.status==='failed')throw new Error(status.error||'识别失败');if(status.status==='completed'){renderResult({...status,title:$('title').value.trim(),manual_entries:state.manual,manual_draft:$('manualDraft').value});setNotice(`处理完成。${status.duplicate_count?`已排除 ${status.duplicate_count} 个重复文件。`:''}`);break}}await loadHistory()}catch(error){setNotice(error.message,'error')}finally{$('start').disabled=false}};
$('parseManual').onclick=async()=>{try{const parsed=await parseManualDraft($('manualDraft').value);state.manual=parsed.manual_entries;renderManual();setNotice(parsed.errors.length?parsed.errors.join('；')+'。未可靠解析的行没有加入合计。':`已解析 ${state.manual.length} 组补录，请保存到当前批次。`,parsed.errors.length?'warn':'ok')}catch(error){setNotice(error.message,'error')}};
$('saveManual').onclick=async()=>{if(!state.jobId)return setNotice('请先开始一次提取或打开一个历史批次。','warn');try{const parsed=await parseManualDraft($('manualDraft').value);if(parsed.errors.length)return setNotice(parsed.errors.join('；')+'。请修正后再保存。','error');state.manual=parsed.manual_entries;renderManual();await api(`/api/history/${state.jobId}/manual`,{method:'PUT',json:{manual_entries:state.manual,manual_draft:$('manualDraft').value}});setNotice(`补录已绑定当前批次，合计 ¥${state.manual.reduce((s,i)=>s+Number(i.金额),0).toFixed(2)}。`);await loadHistory()}catch(error){setNotice(error.message,'error')}};
$('rename').onclick=async()=>{const title=prompt('新的报销单标题 / 文件名',state.result?.title||$('title').value);if(!title)return;try{await api(`/api/history/${state.jobId}`,{method:'PATCH',json:{title}});$('title').value=title;if(state.result){state.result.title=title;renderResult(state.result)}await loadHistory()}catch(error){setNotice(error.message,'error')}};
$('export').onclick=async()=>{try{const response=await api('/api/export',{method:'POST',json:{job_id:state.jobId,title:$('title').value.trim()}});const blob=await response.blob();const disposition=response.headers.get('Content-Disposition')||'';const match=disposition.match(/filename\*=UTF-8''([^;]+)/i);const name=match?decodeURIComponent(match[1]):'费用报销单.xlsx';const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(error){setNotice(error.message,'error')}};
$('toggleManual').onclick=()=>{const hidden=$('manualBody').classList.toggle('hidden');$('toggleManual').textContent=hidden?'展开':'收起'};$('refreshHistory').onclick=loadHistory;renderManual();if($('token').value)loadHistory();
</script></body></html>
