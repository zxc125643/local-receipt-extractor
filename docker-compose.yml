services:
  receipt-extractor:
    build: .
    container_name: local-receipt-extractor
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8766}:8765"
    environment:
      RECEIPT_DATA_DIR: /data
      RECEIPT_OCR_ENGINE: paddle
      # 留空即可关闭访问口令；如需保护局域网服务，再在 .env 中设置。
      RECEIPT_ACCESS_TOKEN: "${RECEIPT_ACCESS_TOKEN:-}"
      RECEIPT_OCR_THREADS: "${RECEIPT_OCR_THREADS:-2}"
      RECEIPT_OCR_WORKERS: "${RECEIPT_OCR_WORKERS:-2}"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    volumes:
      - receipt-data:/data
      - receipt-models:/root/.paddlex

volumes:
  receipt-data:
  receipt-models:
